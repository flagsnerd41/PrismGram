name: Compile PrismGram Patch Bundle

on:
  push:
    branches:
      - prism/ios-floating-glass-nav
    paths:
      - '**.gradle'
      - '**.gradle.kts'
      - '**.kt'
      - '**.java'
      - '**.toml'
      - 'gradle/**'
      - 'gradlew'
      - 'gradle.properties'
      - 'patches/**'
      - 'extensions/**'
      - '.github/workflows/compile-patch-bundle.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prismgram-patch-bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-patch-bundle:
    name: Compile .mpp patch bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile patch project
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew --no-daemon :patches:build

      - name: Find patch bundle
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle="$(find patches/build/libs -maxdepth 1 -type f -name 'patches-*.mpp' ! -name '*-sources*' ! -name '*-javadoc*' -print -quit)"
          if [[ -z "$bundle" ]]; then
            echo "No .mpp patch bundle was produced." >&2
            exit 1
          fi
          echo "path=$bundle" >> "$GITHUB_OUTPUT"
          echo "Found patch bundle: $bundle"
          ls -lh "$bundle"

      - name: Upload .mpp artifact
        uses: actions/upload-artifact@v4
        with:
          name: prismgram-patch-bundle
          path: ${{ steps.bundle.outputs.path }}
          if-no-files-found: error
          retention-days: 14

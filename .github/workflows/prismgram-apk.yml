name: PrismGram APK Build

on:
  workflow_dispatch:
    inputs:
      instagram_apk_url:
        description: "Direct HTTPS download URL for a compatible Instagram APK/APKM/XAPK/APKS (use a trusted source)"
        required: true
        type: string
      instagram_format:
        description: "File format at the supplied URL"
        required: true
        type: choice
        options:
          - apk
          - apkm
          - xapk
          - apks
      clone:
        description: "Build as a separate app alongside official Instagram"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: prismgram-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build patched Instagram APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Configure GitHub Packages credentials
        env:
          GPR_USER: ${{ secrets.GPR_USER }}
          GPR_KEY: ${{ secrets.GPR_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$GPR_USER" || -z "$GPR_KEY" ]]; then
            echo "::error::Add repository Actions secrets GPR_USER and GPR_KEY. GPR_KEY must be a token with read:packages access."
            exit 1
          fi
          mkdir -p "$HOME/.gradle"
          {
            printf 'gpr.user=%s\n' "$GPR_USER"
            printf 'gpr.key=%s\n' "$GPR_KEY"
          } >> "$HOME/.gradle/gradle.properties"

      - name: Download compatible Instagram input
        env:
          INSTAGRAM_APK_URL: ${{ inputs.instagram_apk_url }}
          INSTAGRAM_FORMAT: ${{ inputs.instagram_format }}
        run: |
          set -euo pipefail
          case "$INSTAGRAM_APK_URL" in
            https://*) ;;
            *) echo "::error::The input URL must use HTTPS."; exit 1 ;;
          esac
          case "$INSTAGRAM_FORMAT" in
            apk|apkm|xapk|apks) ;;
            *) echo "::error::Unsupported input format."; exit 1 ;;
          esac
          curl --fail --location --retry 3 --retry-delay 2 \
            --output "instagram.$INSTAGRAM_FORMAT" "$INSTAGRAM_APK_URL"
          test -s "instagram.$INSTAGRAM_FORMAT"
          if ! unzip -tq "instagram.$INSTAGRAM_FORMAT" >/dev/null; then
            echo "::error::Downloaded file is not a valid APK/bundle archive. Use a direct download URL, not a webpage."
            exit 1
          fi
          ls -lh "instagram.$INSTAGRAM_FORMAT"

      - name: Download build tools
        run: |
          set -euo pipefail
          mkdir -p tools
          curl --fail --location --retry 3 \
            --output tools/morphe-desktop-1.18.1-all.jar \
            https://github.com/MorpheApp/morphe-desktop/releases/download/v1.18.1/morphe-desktop-1.18.1-all.jar
          curl --fail --location --retry 3 \
            --output tools/APKEditor-1.4.9.jar \
            https://github.com/REAndroid/APKEditor/releases/download/V1.4.9/APKEditor-1.4.9.jar
          test -s tools/morphe-desktop-1.18.1-all.jar
          test -s tools/APKEditor-1.4.9.jar

      - name: Build and patch Instagram
        env:
          INSTAGRAM_FORMAT: ${{ inputs.instagram_format }}
          BUILD_CLONE: ${{ inputs.clone }}
        run: |
          set -euo pipefail
          args=("instagram.$INSTAGRAM_FORMAT")
          if [[ "$BUILD_CLONE" == "true" ]]; then
            args+=("--clone")
          fi
          chmod +x ./build.sh ./gradlew
          ./build.sh "${args[@]}"
          test -s feurstagram.apk
          ls -lh feurstagram.apk

      - name: Upload patched APK
        uses: actions/upload-artifact@v4
        with:
          name: PrismGram-${{ inputs.clone == true && 'clone' || 'standard' }}-APK
          path: feurstagram.apk
          if-no-files-found: error
          retention-days: 7
